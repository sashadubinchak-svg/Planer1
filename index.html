<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#f2f3f8;--card:#ffffff;--card2:#eceef5;--sec:#eceef5;--line:rgba(18,20,45,.1);--tx:#13152b;--hint:#6a6e86;--btn:#4256e0;--btx:#ffffff;--acc:#3347d1;--accbg:rgba(66,86,224,.1);--accline:rgba(66,86,224,.32);--ok:#16a870;--okbg:rgba(22,168,112,.08);--bad:#e0405a;--warn:#c98a10;--pl:rgba(18,20,45,.06);--pw:rgba(255,255,255,.2);--disp:Inter,system-ui,sans-serif;color-scheme:light}
:root[data-theme=dark]{--bg:#0b0c11;--card:#13141b;--card2:#1b1c25;--sec:#1b1c25;--line:rgba(255,255,255,.08);--tx:#e8e9f1;--hint:#868aa0;--btn:#6d80ff;--btx:#ffffff;--acc:#a3b1ff;--accbg:rgba(109,128,255,.15);--accline:rgba(130,148,255,.38);--ok:#3ddc97;--okbg:rgba(61,220,151,.09);--bad:#ff6b7a;--warn:#f5b94a;--pl:rgba(255,255,255,.07);--pw:rgba(255,255,255,.16);color-scheme:dark}
:root{--rings:repeating-radial-gradient(circle at 100% 0%,var(--pl) 0 1px,transparent 1px 13px);--hatch:repeating-linear-gradient(135deg,var(--pl) 0 1px,transparent 1px 8px);--dots:radial-gradient(var(--accline) 1px,transparent 1.3px) 0 0/7px 7px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{position:relative;margin:0;font:400 15px/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--tx);padding:16px 16px 118px;min-height:100vh}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
[role=button]:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* иконки */
.ic{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
.ic svg{width:100%;height:100%;display:block}
/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 16px}
.logo{font:700 20px Inter,system-ui,sans-serif;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font:600 12.5px Inter,system-ui,sans-serif}
.chip .ic{color:var(--warn);width:16px;height:16px}
/* нижняя панель: активная вкладка раскрывается с подписью */
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:20;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav button{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1px solid transparent;border-radius:20px;background:none;color:var(--hint);font:600 0/1 Inter,system-ui,sans-serif;transition:flex-grow .25s ease,background .2s}
nav i{display:grid;place-items:center;font-style:normal}
nav .ic{width:22px;height:22px}
nav button.on{flex-grow:2.4;color:var(--tx);font-size:13px;background:radial-gradient(var(--pl) 1px,transparent 1.3px) 0 0/6px 6px,var(--card2);border-color:var(--line)}
/* переключатели */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:none;color:var(--hint);padding:10px 4px;border-radius:12px;font:600 13.5px Inter,system-ui,sans-serif}
.seg .on{background:var(--hatch),var(--card2);color:var(--tx);border-color:var(--line)}
.nv{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.nv button,.sm{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:12px;padding:8px 13px;font:600 14px Inter,system-ui,sans-serif}
.nv button:active,.sm:active,.ch button:active{transform:scale(.97)}
.nv b{text-transform:capitalize;text-align:center;font-weight:600}
/* строки и карточки */
.r{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
.r:active{background:var(--card2)}
.cb{width:24px;height:24px;border:1.5px solid var(--hint);border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.cb .ic{width:16px;height:16px}.cb .ic svg{stroke-width:3}
.r.ok{background:var(--okbg);border-color:rgba(61,220,151,.28)}
.r.ok .cb{background:var(--ok);border-color:var(--ok)}
.r.ok span:nth-child(2){opacity:.55;text-decoration:line-through}
.cb.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
small,.hint{color:var(--hint)}.hint{text-align:center;margin:26px 0}
.str{color:var(--warn);font-size:12px;letter-spacing:1px}
.pg{height:8px;background:var(--card2);border-radius:6px;margin:0 0 14px;overflow:hidden}
.pg i{display:block;height:100%;border-radius:6px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px),var(--ok)}
.win{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,151,.32);border-radius:14px;padding:12px;font-weight:600;margin-bottom:12px;animation:pop .4s ease-out}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card .card{border-radius:14px}
.fl{display:block;color:var(--hint);font-size:12.5px;font-weight:500;margin:12px 0 5px}
/* поля ввода */
input,textarea,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:6px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accline);box-shadow:0 0 0 3px var(--accbg)}
input:disabled{opacity:.55}
textarea{min-height:130px}
.ch{display:flex;gap:6px;margin:10px 0}
.ch button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 0;background:var(--card2);color:var(--tx);font:500 14px Inter,system-ui,sans-serif}
.ch button.on{background:var(--dots),var(--accbg);border-color:var(--accline);color:var(--acc);font-weight:600}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;background:repeating-linear-gradient(135deg,var(--pw) 0 1px,transparent 1px 7px),var(--btn);color:var(--btx);font:600 15.5px Inter,system-ui,sans-serif;margin:12px 0}
.go:active{transform:scale(.985);filter:brightness(.92)}
.del{display:inline-flex;align-items:center;margin-left:auto;border:0;background:none;color:var(--bad);padding:4px}
.del .ic{width:18px;height:18px}
/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-bottom:12px}
.cal div{padding:9px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);position:relative;font-size:14px;font-weight:500}
.cal .h{background:none;border:0;color:var(--hint);font-size:12px;padding:2px}.cal .e{background:none;border:0}
.cal .has::after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ok)}
.cal .miss{background:rgba(255,107,122,.14);color:var(--bad);border-color:rgba(255,107,122,.3)}
.cal .ok{background:var(--accbg);color:var(--acc);border-color:var(--accline)}
.cal .late{background:rgba(245,185,74,.16);color:var(--warn);border-color:rgba(245,185,74,.35)}
.cal .sl{outline:2px solid var(--acc);outline-offset:1px}
.cal .tdy{background:var(--btn);color:#fff;border-color:transparent;font-weight:700}
/* профиль */
.av{width:92px;height:92px;border-radius:50%;object-fit:cover;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font:700 34px Inter,system-ui,sans-serif;margin:6px auto 10px;border:1px solid var(--accline)}
.m{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.m.on{background:var(--dots),var(--accbg);border-color:var(--accline)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.g3 div{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 4px;text-align:center}
.g3 b{display:block;font:700 17px Inter,system-ui,sans-serif;margin-top:2px}
.g3 small,.bs small{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:600}
.y{color:var(--ok);font-weight:700}.x{color:var(--bad);font-weight:700}.n{color:var(--hint)}
.red{color:var(--bad)}
/* плитки депозитов */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dt{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:5px;min-height:112px;background:var(--rings),var(--card)}
.dt.d1{background:var(--rings),linear-gradient(155deg,rgba(61,220,151,.17),transparent 62%),var(--card);border-color:rgba(61,220,151,.28)}
.dt.d2{background:var(--rings),linear-gradient(155deg,rgba(109,128,255,.2),transparent 62%),var(--card);border-color:var(--accline)}
.dt b{font:700 22px/1.15 Inter,system-ui,sans-serif;position:relative}
.dt .t{position:relative;font-size:12px;color:var(--hint);font-weight:500}
.dt .em+.t{display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600}
.dt .em+.t .ic{width:15px;height:15px;color:var(--tx)}
.dt .em{position:absolute;right:8px;bottom:6px;color:var(--tx);opacity:.13}
.dt .em .ic{width:66px;height:66px}.dt .em svg{stroke-width:1.1}
.dt:active{background-color:var(--card2)}
/* переключатель темы, кнопки профиля */
.th{position:absolute;top:16px;right:16px;width:54px;height:30px;border-radius:15px;background:var(--card2);border:1px solid var(--line);z-index:5}
.th i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-style:normal;transition:transform .25s}
.th i .ic{width:13px;height:13px}
.th.dk i{transform:translateX(24px)}
.ed{position:absolute;top:16px;left:16px;font-size:12px!important;padding:7px 10px!important;z-index:5}
.tro{position:absolute;top:16px;right:80px;z-index:5;padding:0!important;width:38px;height:30px}
.tro .ic{color:var(--warn);width:17px;height:17px}
/* лучший месяц */
.best{position:relative;overflow:hidden;background:var(--rings),linear-gradient(160deg,rgba(245,185,74,.2),transparent 68%),var(--card);border:1px solid rgba(245,185,74,.38);border-radius:20px;padding:18px;margin-bottom:14px;text-align:center}
.best .em{position:absolute;right:-6px;top:-8px;color:var(--warn);opacity:.2}
.best .em .ic{width:96px;height:96px}.best .em svg{stroke-width:1}
.best .mo{font:600 16px Inter,system-ui,sans-serif;position:relative;text-transform:capitalize}
.best .big{font:700 36px/1.15 Inter,system-ui,sans-serif;position:relative;margin:6px 0;letter-spacing:-.02em}
.bs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;position:relative}
.bs div{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:9px 2px}
.bs b{display:block;font:700 16px Inter,system-ui,sans-serif}
/* конверсия */
.gauge{position:relative;width:156px;height:156px;margin:4px auto 10px}
.gauge svg{display:block}
.gauge .gc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .gc b{font:700 34px/1 Inter,system-ui,sans-serif}.gauge .gc small{font-weight:600;margin-top:4px}
.arc{animation:fillarc 1.1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fillarc{from{stroke-dashoffset:var(--c)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function iconize(root){
 if(!root)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];
 while(w.nextNode())L.push(w.currentNode);
 for(const t of L){
  const p=t.parentNode,v=t.nodeValue;
  if(!p||/^(OPTION|TEXTAREA|SCRIPT|STYLE|TITLE)$/.test(p.nodeName))continue;

// ---------- хранилище ----------
// Лимит CloudStorage: 4096 символов на ключ. Большие списки режутся на части (lget/lset),
// отчёты и отметки хранятся по неделям. Ошибки записи больше не молчат.
const LIM=4096;let lastErr=0;
const fail=()=>{if(Date.now()-lastErr>3000){lastErr=Date.now();alertM('Не удалось сохранить: превышен лимит хранилища или ошибка записи. Сделайте экспорт в профиле.')}};
const S={
 raw:k=>new Promise(r=>{if(cloud)tg.CloudStorage.getItem(k,(e,v)=>r(e?null:(v||null)));else{try{r(localStorage.getItem(k))}catch(_){r(null)}}}),
 get:async k=>{const v=await S.raw(k);if(!v)return null;try{return JSON.parse(v)}catch(_){return null}},
 setRaw:(k,s)=>{
  if(s.length>LIM){fail();return false}
  if(cloud)tg.CloudStorage.setItem(k,s,(e,ok)=>{if(e||!ok)fail()});
  else{try{localStorage.setItem(k,s)}catch(_){fail();return false}}
  return true},
 set:(k,v)=>S.setRaw(k,JSON.stringify(v)),
 setP:(k,s)=>new Promise(r=>{if(s.length>LIM)return r(false);if(cloud)tg.CloudStorage.setItem(k,s,(e,ok)=>r(!e&&!!ok));else{try{localStorage.setItem(k,s);r(true)}catch(_){r(false)}}}),
 del:k=>{if(cloud)tg.CloudStorage.removeItem(k);else{try{localStorage.removeItem(k)}catch(_){}}},
 keys:()=>new Promise(r=>{if(cloud)tg.CloudStorage.getKeys((e,a)=>r(e?[]:(a||[])));else{try{r(Object.keys(localStorage))}catch(_){r([])}}})
};
const MYKEY=/^(p|st|ph|th|cf|lcf|sd|tasks.*|goals.*|lx.*|l\d+|ld\d+|l[km]\d+|w[\d-]+|r[\d-]+|f[abc]?[\d-]+|q[a-z0-9]+_\d+)$/;
const CN={};
async function lget(n){
 const c=await S.get(n+'_n');
 if(c===null){CN[n]=0;return(await S.get(n))||[]} // старый формат: один ключ
 CN[n]=c;let a=[];for(let i=0;i<c;i++)a=a.concat((await S.get(n+'_'+i))||[]);return a;
}
function lset(n,arr){
 const ch=[];let cur=[],len=2;
 for(const x of arr){const l=JSON.stringify(x).length+1;if(cur.length&&len+l>3500){ch.push(cur);cur=[];len=2}cur.push(x);len+=l}
 ch.push(cur);
 const old=CN[n]||0;CN[n]=ch.length;
 Promise.all(ch.map((c,i)=>S.setP(n+'_'+i,JSON.stringify(c)))).then(ok=>{
  if(!ok.every(Boolean)){CN[n]=old;fail();return} // счётчик не трогаем, пока не записаны все части
  S.set(n+'_n',ch.length);if(!old)S.del(n);
  for(let i=ch.length;i<old;i++)S.del(n+'_'+i);
 });
}

async function lrw(d){

 let o=await S.get('r'+k);
 if(!o){ // перенос из старого формата (один ключ на месяц)
  o={};let ch=0;

 R[k]=o;

}

   const sc=Math.min(1,m/im.width),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
   const c=document.createElement('canvas');c.width=w;c.height=h;
   const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
   for(const q of [.5,.38,.28]){const u=c.toDataURL('image/jpeg',q);if(u.length<=PMAX)return res(u)}

  res(null)};

})}

let cvp='m'; // период конверсии: w неделя / m месяц / a всё время
// Конверсия: трубки → предлоги → депозиты. Оценка = среднее двух шагов воронки:
// (предлоги / трубки + депозиты / предлоги) / 2, каждый шаг не больше 100%.
async function convCard(){
 const T=now();let a,b;
 if(cvp==='w'){a=iso(mon(T));b=iso(add(mon(T),6))}
 else if(cvp==='m'){a=iso(new Date(T.getFullYear(),T.getMonth(),1,12));b=iso(new Date(T.getFullYear(),T.getMonth()+1,0,12))}
 else{a=SD||iso(T);b=iso(T)}
 const n=Math.max(1,dayDiff(b,a)+1);
 await lrr(D12(a),n);
 let calls=0,offers=0;
 for(let i=0;i<n;i++){const k=iso(add(D12(a),i));if(done(k)){const r=rep(k);calls+=+r.calls||0;offers+=+r.offers||0}}
 const dep=(await loadDeps()).filter(x=>x.d>=a&&x.d<=b).length;
 const s1=calls?Math.min(1,offers/calls):0,s2=offers?Math.min(1,dep/offers):0;
 const has=calls>0,score=has?Math.round((s1+s2)/2*100):null;
 const col=score===null?'var(--sec)':score<40?'#FF4D6D':score<60?'#FF9A3D':score<80?'#FFD23F':'#1DBF73';
 const lab=score===null?'нет данных':score<40?'слабо':score<60?'средне':score<80?'хорошо':'отлично';
 const C=2*Math.PI*54,off=C*(1-(score||0)/100),pc=x=>Math.round(x*100)+'%';
 const per=[['w','Неделя'],['m','Месяц'],['a','Всё время']];
 return `<div class="card"><b>📈 Конверсия</b>
 <div class="ch">${per.map(([v,l])=>`<button class="${cvp===v?'on':''}" onclick="cvp='${v}';render()">${l}</button>`).join('')}</div>
 <div class="gauge"><svg viewBox="0 0 140 140" width="156" height="156"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--sec)" stroke-width="14"/>${score>0?`<circle class="arc" cx="70" cy="70" r="54" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" style="--c:${C};stroke-dashoffset:${off}" transform="rotate(-90 70 70)"/>`:''}</svg>
 <div class="gc"><b>${score===null?'—':score}</b><small style="color:${score===null?'var(--hint)':col}">${lab}</small></div></div>
 <div class="g3"><div><b>${fmt(calls)}</b><small>трубки</small></div><div><b>${fmt(offers)}</b><small>предлоги</small></div><div><b>${fmt(dep)}</b><small>депозиты</small></div></div>`
 +(has?`<small style="display:block">Трубки → предлоги: <b>${pc(s1)}</b> · Предлоги → депозиты: <b>${pc(s2)}</b><br>Из трубок в депозит: <b>${pc(calls?dep/calls:0)}</b> · на 100 трубок: ${Math.round(offers/calls*100)} предлогов и ${Math.round(dep/calls*100)} депозитов</small>`
  :'<small style="display:block">Нет трубок за этот период: заполните дневные отчёты, и здесь появится оценка.</small>')
 +`<small style="display:block;margin-top:6px">Оценка — среднее двух шагов: предлоги÷трубки и депозиты÷предлоги. Красный до 40, оранжевый 40–59, жёлтый 60–79, зелёный от 80.</small></div>`;
}

document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click()}});

 $('#app').innerHTML=((tab==='p'||(tab==='l'&&lead))?'':hdr())+html;lastTog=null;iconize($('#app'));a11y($('#app'));
}

  ST.xt=Math.round(ST.xt/10);ST.xg=Math.round(ST.xg/2.5);ST.v=2;S.set('st',ST);
